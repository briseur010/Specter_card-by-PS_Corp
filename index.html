<head>

</head>
<body class="dark-theme"> 

    <div class="phone-container">
        
        <!-- Bouton de bascule de Thème (Sombre / Clair) -->

        <header class="header">

                </svg>
                Premium Member

            <!-- Nouveau Logo PS Corp -->
            <div class="logo-container">
                <img src="images/logo.jpg" alt="PS Corp Logo" class="logo-img" id="logoEntreprise">
            </div>
            
            <div class="company-info">
                <h1 id="nomEntreprise">PS Corp</h1>
                <p class="company-tagline" id="taglineEntreprise">Innovation technologique</p>
            </div>
        </header>

        <!-- Profil Personnel -->
<section class="profile-card">
    <div class="profile-avatar" id="avatarContainer"></div>
    <h2 class="profile-name" id="nomEmploye">Chargement...</h2>
    <div class="profile-role">
        <svg class="icon-briefcase" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/>

</section>

        

        <div class="section-title">Carte de visite connectée</div>

        <nav class="links-list">
            
            <!-- Téléphone -->

                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>

                    <div class="link-value" id="txtTelephone">...</div>
                </div>
                <div class="arrow-right">➔</div>
            </a>

            <!-- Instagram -->
            <a href="#" target="_blank" class="link-item hover-instagram" id="btnInstagram">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                </div>
                <div class="link-content">
                    <div class="link-label">Instagram</div>
                    <div class="link-value" id="txtInstagram">...</div>
                </div>
                <div class="arrow-right">➔</div>
            </a>

            <!-- Email -->
            <a href="#" class="link-item hover-email" id="btnEmail">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </div>
                <div class="link-content">
                    <div class="link-label">Email</div>
                    <div class="link-value" id="txtEmail">...</div>
                </div>
                <div class="arrow-right">➔</div>
            </a>

            <!-- Site Web -->
            <a href="#" target="_blank" class="link-item hover-web" id="btnSiteWeb">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <div class="link-content">
                    <div class="link-label">Site Web</div>
                    <div class="link-value" id="txtSiteWeb">...</div>
                </div>
                <div class="arrow-right">➔</div>
            </a>

            <!-- WhatsApp -->
            <a href="#" target="_blank" class="link-item hover-whatsapp" id="btnWhatsappLink">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.262 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.717-1.455L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.413 9.863-9.843.001-2.63-1.023-5.101-2.884-6.965C16.566 1.933 14.095 1.01 11.472 1.01c-5.442 0-9.866 4.415-9.87 9.845-.001 1.77.46 3.497 1.334 5.025l-.995 3.638 3.71-.973zm13.114-6.306c-.303-.151-1.793-.883-2.073-.984-.279-.102-.483-.152-.686.152-.204.304-.787.984-.965 1.186-.177.202-.355.228-.658.077-.303-.152-1.28-.472-2.438-1.503-.9-.802-1.507-1.793-1.684-2.097-.177-.302-.018-.467.133-.617.136-.134.303-.354.455-.531.152-.177.202-.303.303-.506.102-.203.051-.38-.025-.531-.076-.152-.686-1.654-.939-2.261-.247-.594-.499-.514-.686-.524-.177-.008-.38-.01-.583-.01-.203 0-.533.076-.813.38-.28.304-1.067 1.039-1.067 2.535s1.092 2.94 1.244 3.143c.152.203 2.15 3.284 5.21 4.602.727.314 1.295.5 1.738.641.73.232 1.393.197 1.918.12.584-.085 1.793-.733 2.047-1.443.254-.71.254-1.317.177-1.443-.077-.126-.28-.203-.584-.354z"/></svg>
                </div>
                <div class="link-content">
                    <div class="link-label">WhatsApp</div>
                    <div class="link-value" id="txtWhatsApp">...</div>
                </div>
                <div class="arrow-right">➔</div>
            </a>

            <!-- Enregistrer Contact -->
            <button class="link-item save-contact hover-save" id="btnEnregistrer">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
                </div>
                <div class="link-content">
                    <div class="link-label">Enregistrer</div>
                    <div class="link-value">Ajouter aux contacts</div>
                </div>
                <div class="arrow-right">➔</div>
            </button>

        </nav>

        <footer class="footer-buttons">
            <button class="btn btn-share" id="btnActionPartager">
                Partager la carte
            </button>
        </footer>

    </div>

    <script>
        // Centralisation des données 
        const donnéesCarte = {
            prenom: "MUDIAYI NGOYI",
            nom: "PRECIEUX",
            poste: "CEO",
            entreprise: "PS Corp",
            tagline: "Innovation technologique",
            telephone: "+243853013816",
            telephoneFormate: "+243 853 013 816",
            instagramUser: "lazy_specter_",
            instagramUrl: "https://instagram.com/lazy_specter_",
            email: "mnpprecieux@gmail.com",
            siteWeb: "devon-rdc.vercel.app",
            urlSiteWeb: "https://devon-rdc.vercel.app"
        };

        document.addEventListener("DOMContentLoaded", () => {
            
            // --- INJECTION DE DONNÉES DANS L'INTERFACE ---
            document.getElementById("nomEntreprise").innerHTML = `<span>${donnéesCarte.entreprise.split(' ')[0]}</span> ${donnéesCarte.entreprise.split(' ').slice(1).join(' ')}`;
            document.getElementById("taglineEntreprise").textContent = donnéesCarte.tagline;
            document.getElementById("nomEmploye").textContent = `${donnéesCarte.prenom} ${donnéesCarte.nom}`;
            document.getElementById("posteEmploye").textContent = donnéesCarte.poste;
            
            // Paramétrage des boutons
            document.getElementById("btnTelephone").href = `tel:${donnéesCarte.telephone}`;
            document.getElementById("txtTelephone").textContent = donnéesCarte.telephoneFormate;

            document.getElementById("btnInstagram").href = donnéesCarte.instagramUrl;
            document.getElementById("txtInstagram").textContent = `@${donnéesCarte.instagramUser}`;

            document.getElementById("btnEmail").href = `mailto:${donnéesCarte.email}`;
            document.getElementById("txtEmail").textContent = donnéesCarte.email;

            document.getElementById("btnSiteWeb").href = donnéesCarte.urlSiteWeb;
            document.getElementById("txtSiteWeb").textContent = donnéesCarte.siteWeb;

            document.getElementById("btnWhatsappLink").href = `https://wa.me/${donnéesCarte.telephone.replace('+', '')}`;
            document.getElementById("txtWhatsApp").textContent = donnéesCarte.telephoneFormate;

            // Génération et affichage immédiat des initiales (ex: M + P = MP)
const avatarContainer = document.getElementById("avatarContainer");
const initiales = (donnéesCarte.prenom.charAt(0) + donnéesCarte.nom.charAt(0)).toUpperCase();
avatarContainer.textContent = initiales;
            
            
            avatarImg.onerror = () => {
                avatarImg.style.display = "none";
                const initiales = (donnéesCarte.prenom.charAt(0) + donnéesCarte.nom.charAt(0)).toUpperCase();
                avatarContainer.textContent = initiales;
            };

            // --- TÉLÉCHARGEMENT DU FICHIER CONTACT (VCARD) ---
            const btnEnregistrer = document.getElementById("btnEnregistrer");
            btnEnregistrer.addEventListener("click", () => {
                const vcard = `BEGIN:VCARD\n` +
                              `VERSION:3.0\n` +
                              `N:${donnéesCarte.nom};${donnéesCarte.prenom};;;\n` +
                              `FN:${donnéesCarte.prenom} ${donnéesCarte.nom}\n` +
                              `ORG:${donnéesCarte.entreprise}\n` +
                              `TITLE:${donnéesCarte.poste}\n` +
                              `TEL;TYPE=CELL:${donnéesCarte.telephone}\n` +
                              `EMAIL;TYPE=PREF,INTERNET:${donnéesCarte.email}\n` +
                              `URL:${donnéesCarte.urlSiteWeb}\n` +
                              `END:VCARD`;

                const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${donnéesCarte.prenom.replace(/\s+/g, '_')}_${donnéesCarte.nom}.vcf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // --- BOUTON DE PARTAGE DE LIEN ---
            const btnPartager = document.getElementById("btnActionPartager");
            btnPartager.addEventListener("click", async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: `Carte de ${donnéesCarte.prenom} ${donnéesCarte.nom}`,
                            text: `Enregistrez le contact de ${donnéesCarte.prenom} ${donnéesCarte.nom} (${donnéesCarte.poste})`,
                            url: window.location.href
                        });
                    } catch (err) {
                        console.log("Partage non finalisé.");
                    }
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert("Lien de la carte copié dans le presse-papier !");
                }
            });

            // --- SÉLECTEUR DE THÈME DYNAMIQUE ---
            const themeToggleBtn = document.getElementById("themeToggleBtn");
            const body = document.body;
            const iconSun = themeToggleBtn.querySelector(".icon-sun");
            const iconMoon = themeToggleBtn.querySelector(".icon-moon");

            themeToggleBtn.addEventListener("click", () => {
                if (body.classList.contains("dark-theme")) {
                    body.classList.replace("dark-theme", "light-theme");
                    iconSun.style.display = "none";
                    iconMoon.style.display = "block";
                } else {
                    body.classList.replace("light-theme", "dark-theme");
                    iconSun.style.display = "block";
                    iconMoon.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
